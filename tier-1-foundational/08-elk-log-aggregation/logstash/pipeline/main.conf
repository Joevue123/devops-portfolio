input {
  beats {
    port => 5044
    ssl  => false   # enable in production with SSL certs
  }

  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # ── Nginx access logs ──────────────────────────────────────────────────────
  if [fields][log_type] == "nginx_access" {
    grok {
      match => {
        "message" => '%{COMBINEDAPACHELOG}'
      }
      add_tag => ["nginx_parsed"]
    }

    if "_grokparsefailure" not in [tags] {
      mutate {
        convert => { "response" => "integer" "bytes" => "integer" }
        rename  => { "response" => "http_status" "bytes" => "bytes_sent" }
      }

      geoip {
        source => "clientip"
        target => "geoip"
      }

      useragent {
        source => "agent"
        target => "user_agent"
      }
    }
  }

  # ── Structured JSON app logs ───────────────────────────────────────────────
  if [fields][log_type] == "app" {
    json {
      source  => "message"
      target  => "app"
      add_tag => ["app_parsed"]
    }

    if [app][timestamp] {
      date {
        match   => ["[app][timestamp]", "ISO8601"]
        target  => "@timestamp"
        remove_field => ["[app][timestamp]"]
      }
    }
  }

  # ── Common enrichment for all logs ────────────────────────────────────────
  mutate {
    add_field => { "[@metadata][index_prefix]" => "logs-%{[fields][log_type]}" }
  }

  # Drop health check noise
  if [request] =~ "/health" or [uri] =~ "/health" {
    drop {}
  }
}

output {
  elasticsearch {
    hosts            => ["http://elasticsearch:9200"]
    index            => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    ilm_enabled      => true
    ilm_rollover_alias => "%{[@metadata][index_prefix]}"
    ilm_policy       => "logs-policy"
  }

  # Debug to stdout — remove in production
  # stdout { codec => rubydebug }
}
