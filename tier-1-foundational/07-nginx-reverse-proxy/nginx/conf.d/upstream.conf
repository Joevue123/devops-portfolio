# Weighted round-robin upstream pool
upstream app_servers {
    least_conn;

    server app1:3000 weight=1 max_fails=3 fail_timeout=30s;
    server app2:3000 weight=1 max_fails=3 fail_timeout=30s;
    server app3:3000 weight=2 max_fails=3 fail_timeout=30s;  # more powerful node

    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout  60s;
}
