services:
  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - ./vault/config:/vault/config:ro
      - vault-data:/vault/data
    command: vault server -dev -dev-root-token-id=root
    networks: [vault]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-init:
    image: hashicorp/vault:1.17
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    volumes:
      - ./scripts:/scripts:ro
    command: sh /scripts/init-vault.sh
    depends_on:
      vault:
        condition: service_healthy
    networks: [vault]

networks:
  vault:
    driver: bridge

volumes:
  vault-data:
