global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/CHANGEME'

route:
  group_by: [alertname, cluster, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-warnings

  routes:
    - matchers:
        - severity = critical
      receiver: pagerduty-critical
      continue: true

    - matchers:
        - severity = critical
      receiver: slack-critical

    - matchers:
        - alertname = Watchdog
      receiver: blackhole   # suppress always-firing healthcheck alert

inhibit_rules:
  # If cluster is down, suppress all individual pod alerts
  - source_matchers: [alertname = ClusterDown]
    target_matchers: [alertname =~ Pod.*]
    equal: [cluster]

receivers:
  - name: blackhole

  - name: slack-warnings
    slack_configs:
      - channel: '#alerts-warning'
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: slack-critical
    slack_configs:
      - channel: '#alerts-critical'
        title: ':fire: [CRITICAL] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\nRunbook: {{ .Annotations.runbook }}{{ end }}'
        send_resolved: true

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: 'CHANGEME'
        severity: critical
        description: '{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}'
