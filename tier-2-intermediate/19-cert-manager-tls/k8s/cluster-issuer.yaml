---
# Staging issuer — use first, no rate limits
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: joevue123@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: CHANGEME
            # IRSA — no stored AWS credentials
            serviceAccountRef:
              name: cert-manager
              namespace: cert-manager

---
# Production issuer — use after staging works
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: joevue123@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: CHANGEME
            serviceAccountRef:
              name: cert-manager
              namespace: cert-manager
