apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api-http-scaler
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: http_requests_per_second
        query: sum(rate(http_requests_total{job="api"}[2m]))
        threshold: "100"    # scale up when > 100 RPS per pod
        activationThreshold: "10"
