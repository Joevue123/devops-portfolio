# Error Budget Policy — defines team response at each depletion threshold
#
# This is a living document. Review after any SLO miss.
# Owner: SRE / Platform Team
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: error-budget-policy
  namespace: monitoring
  labels:
    app: slo-documentation
data:
  policy.md: |
    # Error Budget Policy — API Service

    ## Budget Thresholds and Actions

    ### > 50% remaining (Green)
    - No restrictions on deployments or risky changes
    - Normal sprint velocity, feature work can proceed
    - Weekly SLO review in team standup

    ### 25–50% remaining (Yellow)
    - **Engineering lead must approve** all production changes
    - Increase deploy review: require 2 approvers on PRs touching API
    - Schedule capacity review for next sprint
    - Alert: Slack #platform-sre channel
    - Review: Add to weekly engineering all-hands agenda

    ### 10–25% remaining (Orange)
    - **Freeze non-critical feature deploys**
    - All hands on reliability improvements
    - Daily error budget review
    - Product manager informed — roadmap may be affected
    - Root cause analysis required for all incidents > 5 min

    ### < 10% remaining (Red)
    - **Deploy freeze** — only hotfixes with SRE approval
    - Incident commander assigned until budget recovers above 25%
    - Executive notification required
    - Post-mortem within 48 hours of each significant event
    - Consider rolling back recent changes

    ### Exhausted (0%) — SLO Violation
    - Customer notification within 1 hour (if service-affecting)
    - Executive summary within 2 hours
    - Full post-mortem within 5 business days
    - SLO review: consider adjusting objective or increasing investment

    ## Burn Rate Alert Thresholds (Auto-generated by Sloth)

    | Alert | Window | Burn Rate | Budget Consumed |
    |-------|--------|-----------|-----------------|
    | Fast Page | 1h + 5m | 14.4x | 2% in 1h |
    | Slow Page | 6h + 30m | 6x | 5% in 6h |
    | Fast Ticket | 1d + 2h | 3x | 10% in 24h |
    | Slow Ticket | 3d + 6h | 1x | 10% in 72h |
