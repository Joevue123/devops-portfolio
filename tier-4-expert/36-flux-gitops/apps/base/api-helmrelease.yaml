---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: myorg-charts
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/myorg/helm-charts
  type: oci
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: api
  namespace: production
spec:
  interval: 5m
  chart:
    spec:
      chart: myapp
      version: ">=1.0.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: myorg-charts
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  rollback:
    timeout: 5m
    cleanupOnFail: true
  values:
    image:
      repository: ghcr.io/myorg/api
      # tag is managed by image-automation, substituted here:
      tag: latest    # {"$imagepolicy": "flux-system:api:tag"}
    replicaCount: 1    # overridden per environment
    service:
      type: ClusterIP
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
  valuesFrom:
    - kind: ConfigMap
      name: api-values
      optional: true
