---
# General-purpose node pool — spot-first, on-demand fallback
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      labels:
        nodepool: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [c, m, r]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64, arm64]
      expireAfter: 720h    # recycle nodes every 30 days for patch compliance
  limits:
    cpu: 1000
    memory: 4000Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"       # disrupt at most 10% of nodes at once
---
# Database node pool — on-demand only, memory-optimized, dedicated
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: database
spec:
  template:
    metadata:
      labels:
        nodepool: database
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [r6i, r6g]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [large, xlarge]
      taints:
        - key: dedicated
          value: database
          effect: NoSchedule
  limits:
    cpu: 64
  disruption:
    consolidationPolicy: WhenEmpty    # only consolidate when completely empty
    consolidateAfter: 30m
