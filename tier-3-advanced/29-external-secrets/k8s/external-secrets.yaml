---
# Sync API credentials from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        API_KEY: "{{ .api_key }}"
        STRIPE_SECRET: "{{ .stripe_secret }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: /prod/api/credentials
        property: api_key
    - secretKey: stripe_secret
      remoteRef:
        key: /prod/api/credentials
        property: stripe_secret
---
# Sync dynamic DB creds from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: production
spec:
  refreshInterval: 55m    # shorter than Vault lease TTL of 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: db-dynamic-creds
