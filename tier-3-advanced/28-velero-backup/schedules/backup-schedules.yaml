---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-full-backup
  namespace: velero
spec:
  schedule: "0 2 * * *"
  template:
    includedNamespaces: [production, staging, monitoring]
    excludedResources: [events, events.events.k8s.io]
    storageLocation: aws-s3
    volumeSnapshotLocations: [aws-ebs]
    ttl: 720h
    hooks:
      resources:
        - name: postgres-quiesce
          includedNamespaces: [production]
          labelSelector:
            matchLabels:
              app: postgres
          pre:
            - exec:
                container: postgres
                command: [psql, -U, postgres, -c, CHECKPOINT]
                onError: Fail
                timeout: 30s
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: hourly-production
  namespace: velero
spec:
  schedule: "0 * * * *"
  template:
    includedNamespaces: [production]
    storageLocation: aws-s3
    ttl: 168h
