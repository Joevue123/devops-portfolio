apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci-cd
  namespace: tekton-pipelines
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
    - name: image-name
      type: string
    - name: image-tag
      type: string
      default: latest

  workspaces:
    - name: source
    - name: docker-credentials

  tasks:
    - name: clone
      taskRef:
        resolver: hub
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: version
            value: "0.9"
      workspaces:
        - name: output
          workspace: source
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)

    - name: lint-and-test
      runAfter: [clone]
      taskRef:
        name: npm-lint-test
      workspaces:
        - name: source
          workspace: source

    - name: build-push
      runAfter: [lint-and-test]
      taskRef:
        resolver: hub
        params:
          - name: kind
            value: task
          - name: name
            value: kaniko
          - name: version
            value: "0.6"
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: IMAGE
          value: $(params.image-name):$(params.image-tag)
        - name: EXTRA_ARGS
          value: ["--cache=true", "--cache-repo=$(params.image-name)-cache"]

    - name: scan
      runAfter: [build-push]
      taskRef:
        name: trivy-scan
      params:
        - name: image
          value: $(params.image-name):$(params.image-tag)

    - name: deploy-staging
      runAfter: [scan]
      taskRef:
        name: kubectl-deploy
      params:
        - name: namespace
          value: staging
        - name: deployment
          value: api
        - name: image
          value: $(params.image-name):$(params.image-tag)

  finally:
    - name: notify
      taskRef:
        name: slack-notify
      params:
        - name: status
          value: $(tasks.status)
        - name: pipeline
          value: ci-cd
